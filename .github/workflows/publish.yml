name: Publish to npm

# Runs when a version tag such as v0.1.0 is pushed. The tag should match the version in package.json.
on:
  push:
    tags: ['v*']

# npm trusted publishing: the job proves to npm which repository and workflow it is, so no npm
# token is stored here. The workflow has to be named as a trusted publisher in the package's
# settings on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 brings.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # prepublishOnly type-checks and builds first.
      - name: Publish
        run: npm publish --access public
